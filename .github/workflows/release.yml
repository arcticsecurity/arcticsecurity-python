---
name: Release
# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main

permissions: {}

jobs:
  version-check:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      CHANGED: ${{ steps.check.outputs.CHANGED }}
      VERSION: ${{ steps.check.outputs.VERSION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup UV
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: Detect version change
        id: check
        run: |
          VERSION="$(uv version --short)"
          if git rev-parse "refs/tags/v${VERSION}" > /dev/null 2>&1 ; then
              CHANGED=false
          else
              CHANGED=true
          fi

          {
              echo "VERSION=${VERSION}"
              echo "CHANGED=${CHANGED}"
          } >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    needs:
      - version-check
    if: needs.version-check.outputs.CHANGED == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup UV
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: Build wheel and source package
        run: uv build
      - name: Build documentation
        run: uv run mkdocs build
      - name: Create release notes
        run: |
          awk -v "VER=${VERSION}" '
              BEGIN {
                  gsub(/\./, "\\.", VER);
                  pattern = "^## " VER " - ";
              }
              {
                  if ($0 ~ pattern) {
                      flag = 1;
                      next;
                  }
                  if (flag == 1) {
                      if (/^#[#] /) exit;
                      print;
                  }
              }
              ' CHANGELOG.md > RELEASE_NOTES.md
          if [ -z "$(tr -d '[:space:]' < RELEASE_NOTES.md)" ]; then
              echo "::error::Empty release notes for version ${VERSION} in CHANGELOG.md" 1>&2
              exit 1
          fi
        env:
          VERSION: ${{ needs.version-check.outputs.VERSION }}
      - name: Build RPM spec file
        run: uv run python rpmbuild/generate_spec.py
      - name: Store build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: build-outputs
          path: |
            dist/
            site/
            rpmbuild/python-arcticsecurity.spec
            RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 1

  rpmbuild:
    needs:
      - version-check
      - build
    if: needs.version-check.outputs.CHANGED == 'true'
    uses: $/.github/workflows/rpmbuild.yml
    with:
      build-artifact-name: build-outputs

  github-release:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: write
    needs:
      - version-check
      - build
      - rpmbuild
    if: needs.version-check.outputs.CHANGED == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: build-outputs
          path: .
      - name: Download source RPM artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: python-arcticsecurity-${{ needs.version-check.outputs.VERSION }}-1.el10.src.rpm
          path: dist/
      - name: Download binary RPM artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: python3-arcticsecurity-${{ needs.version-check.outputs.VERSION }}-1.el10.noarch.rpm
          path: dist/
      - name: Create GitHub release
        run: gh release create "$TAG" dist/* --notes-file RELEASE_NOTES.md --title "$TAG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.version-check.outputs.VERSION }}

  publish-pypi:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    environment: release
    permissions:
      id-token: write
    needs:
      - version-check
      - build
      - github-release
    if: needs.version-check.outputs.CHANGED == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup UV
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: build-outputs
          path: .
      - name: Publish to PyPI
        run: uv publish

  publish-docs:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    needs:
      - version-check
      - build
      - github-release
    if: needs.version-check.outputs.CHANGED == 'true'
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: build-outputs
          path: .
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
