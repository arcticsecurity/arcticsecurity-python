---
name: Release
# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main

permissions: {}

jobs:
  publish-pypi:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    environment: release
    permissions:
      contents: write
      id-token: write
    outputs:
      NEW_VERSION: ${{ steps.version-check.outputs.NEW_VERSION }}
      VERSION: ${{ steps.version-check.outputs.VERSION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup UV
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: Detect version change
        id: version-check
        run: |
          awk '{
              if ($1 == "version") {
                  gsub("\"", "", $3);
                  print $3;
              }
          }' pyproject.toml > .package-version

          VERSION="$(cat .package-version)"
          if git rev-parse "v${VERSION}" > /dev/null 2>&1 ; then
              NEW_VERSION=false
          else
              NEW_VERSION=true
          fi

          {
              echo "VERSION=${VERSION}"
              echo "NEW_VERSION=${NEW_VERSION}"
          } >> "$GITHUB_OUTPUT"
      - name: Create release notes
        if: steps.version-check.outputs.NEW_VERSION == 'true'
        run: |
          awk -v "VER=${VERSION}" '
              BEGIN {
                  gsub(/\./, "\\.", VER);
                  pattern = "^## " VER " - ";
              }
              {
                  if ($0 ~ pattern) {
                      flag = 1;
                      next;
                  }
                  if (flag == 1) {
                      if (/^#[#] /) exit;
                      print;
                  }
              }
              ' CHANGELOG.md > RELEASE_NOTES.md
          if [ -z "$(tr -d '[:space:]' < RELEASE_NOTES.md)" ]; then
              echo "::error::Empty release notes for version ${TAG} in CHANGELOG.md" 1>&2
              exit 1
          fi
        env:
          VERSION: ${{ steps.version-check.outputs.VERSION }}
      - name: Build and publish
        if: steps.version-check.outputs.NEW_VERSION == 'true'
        run: |
          uv build
          uv publish
      - name: Create GitHub release
        if: steps.version-check.outputs.NEW_VERSION == 'true'
        run: gh release create "$TAG" dist/* --notes-file RELEASE_NOTES.md --title "$TAG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version-check.outputs.VERSION }}
  publish-docs:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    needs:
      - publish-pypi
    if: needs.publish-pypi.outputs.NEW_VERSION == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup UV
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: Build documentation
        run: uv run mkdocs build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
