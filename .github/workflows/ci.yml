---
name: CI
# yamllint disable-line rule:truthy
on:
  push:

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install latest version of uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run ruff format
        run: uv run ruff format --check
      - name: Run ruff check
        run: uv run ruff check
      - name: Run yamllint
        run: git ls-files '*.yml' '*.yaml' | xargs uv run yamllint -s

  typecheck:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install latest version of uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run mypy
        run: uv run mypy --config-file pyproject.toml -p arcticsecurity
      - name: Run ty
        run: uv run ty check

  pytest:
    strategy:
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    needs:
      - lint
      - typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install latest version of uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run pytest
        run: uv run pytest --doctest-modules

  pytest-lowest:
    # Test with the oldest supported versions of the runtime dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    needs:
      - lint
      - typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install latest version of uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.9"
      - name: Install dependencies
        run: |
          uv venv
          uv pip install --resolution lowest-direct .
          uv pip install pytest
      - name: Run pytest
        run: uv run --no-sync pytest --doctest-modules

  package:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    needs:
      - pytest
      - pytest-lowest
    outputs:
      VERSION: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install latest version of uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - name: Get package version
        id: version
        run: |
          VERSION="$(uv version --short)"
          echo "VERSION=${VERSION}" > "$GITHUB_OUTPUT"
      - name: Build wheel and source package
        run: uv build
      - name: Build documentation
        run: uv run mkdocs build
      - name: Build RPM spec file
        run: uv run python rpmbuild/generate_spec.py
      - name: Store build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: build-outputs
          path: |
            dist/
            site/
            rpmbuild/python-arcticsecurity.spec
          retention-days: 7

  rpmbuild:
    needs:
      - package
    uses: $/.github/workflows/rpmbuild.yml
    with:
      build-artifact-name: build-outputs
